<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="正片 App 图标">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4E5"/>
      <stop offset="0.55" stop-color="#FFF9F1"/>
      <stop offset="1" stop-color="#FFF5E9"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#FF6613"/>
      <stop offset="0.55" stop-color="#FF8B0A"/>
      <stop offset="1" stop-color="#FF7908"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FF9B12"/>
      <stop offset="1" stop-color="#FF730E"/>
    </linearGradient>
    <linearGradient id="rear" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFD1AB"/>
      <stop offset="1" stop-color="#FFC39A"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="250"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <!-- Rear mountain -->
    <path fill="url(#rear)" d="M 573,770 L 705,660 Q 742,624 775,646 Q 787,653 807,673 L 1024,843 L 1024,1024 L 573,1024 Z"/>
    <!-- Front mountain -->
    <path fill="url(#front)" d="M -20,925 L 430,617 Q 471,589 507,620 L 1024,982 L 1024,1024 L -20,1024 Z"/>
    <!-- Ascending tone curve -->
    <path fill="url(#curve)" d="M -30,527 C 149,642 305,573 452,413 C 606,246 691,177 835,196 C 926,203 979,227 1050,268 L 1050,350 C 952,298 897,270 831,274 C 692,267 615,324 499,457 C 339,642 143,730 -30,614 Z"/>
  </g>
</svg>
